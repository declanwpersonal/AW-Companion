<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GM tools</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#1d2230;--mute:#5c6475;--line:#d5d9e2;--acc:#2f5d8a;--bad:#a8322d;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--panel:#1a1f2a;--ink:#e4e7ee;--mute:#9aa3b5;--line:#2c3342;--acc:#8fb8e6;--bad:#f08a84;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:44px;cursor:pointer}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;min-height:44px}
.seg{display:flex;overflow-x:auto;position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line)}.seg button{flex:0 0 auto;padding:8px 14px;white-space:nowrap;border:0;border-radius:0;background:none}.seg .on{color:var(--acc);font-weight:700;box-shadow:inset 0 -3px 0 var(--acc)}
main{max-width:40rem;margin:0 auto;padding:12px 14px 60px}h2{font:700 1.05rem Georgia,serif;color:var(--acc);margin:14px 0 6px}
.g3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.meta{color:var(--mute);font-size:14px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;margin:8px 0}
.pk{display:block;width:100%;text-align:left}.pk small{display:block;color:var(--mute)}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.sg div{text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px}.sg b{display:block;font:700 1.2rem Georgia,serif;color:var(--acc)}.sg span{font-size:12px;color:var(--mute)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.row button{flex:1;min-width:4.5rem}.pri{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:700}
.turn{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}.dead strong{text-decoration:line-through;color:var(--mute)}.res{padding:10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-weight:600;margin:8px 0}
.chip{min-height:36px;padding:2px 10px;font-size:14px;flex:0 0 auto!important;min-width:0!important}.f span{display:block;font-size:13px;color:var(--mute)}.f{display:block}.del{color:var(--bad)}

/* AFTER WORLD — Obsidian Leather visual identity */
:root{--bg:#090b10;--panel:#141820;--ink:#e5e8ed;--mute:#9ba5b3;--line:#343d4b;--acc:#668db8;--hit:#a88b4e;--bad:#d47c78;color-scheme:dark}
html,body{background-color:#090b10!important;color:var(--ink)}
body{background-image:radial-gradient(ellipse at 50% -15%,rgba(39,57,79,.34),transparent 58%),repeating-linear-gradient(2deg,rgba(255,255,255,.012) 0px,rgba(255,255,255,.012) 1px,transparent 1px,transparent 4px),repeating-linear-gradient(92deg,rgba(0,0,0,.12) 0px,rgba(0,0,0,.12) 1px,transparent 1px,transparent 5px),linear-gradient(135deg,#11151c,#080a0e 60%,#10141b)!important;background-attachment:fixed!important;font-family:system-ui,-apple-system,"Segoe UI",sans-serif!important}
header,.seg,#nav,#res{background:linear-gradient(180deg,#1b222d 0%,#11161e 100%)!important;border-color:#394453!important;box-shadow:0 2px 12px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.045)}
header h1,h1,h2,h3,h4{font-family:system-ui,-apple-system,"Segoe UI",sans-serif!important;letter-spacing:.025em}
header h1{font-weight:700}h1,h2,h3,h4{color:#9bb8d6!important}
main{background:transparent}
section,.card,.big div,.sg div,.res,details{background:linear-gradient(145deg,rgba(30,36,46,.96),rgba(17,21,28,.98))!important;border:1px solid #384351!important;box-shadow:inset 0 1px rgba(255,255,255,.035),0 3px 10px rgba(0,0,0,.18)}
button,.btn{background:linear-gradient(180deg,#252d39,#171d26)!important;color:#e5e8ed!important;border:1px solid #465364!important;border-radius:5px!important;box-shadow:inset 0 1px rgba(255,255,255,.07)}
button.pri,.pri{background:linear-gradient(180deg,#315477,#203a55)!important;border-color:#6385a8!important;color:#fff!important}
button.on,.seg .on,#nav button.on{color:#d6bd82!important;border-color:#8f7848!important;box-shadow:inset 0 -2px #a88b4e!important}
input,textarea,select{background:#0d1117!important;color:#e5e8ed!important;border:1px solid #3c4857!important;border-radius:5px!important}
a{color:#9bb8d6}th{background:#202936!important;color:#d9c28f}td,th{border-color:#3b4654!important}
mark{background:#8e7541!important;color:#fff!important}#app{background:#090b10!important}
#ban{background:#171e28!important;border-color:#455264!important;color:#e5e8ed!important}
.ov{background:linear-gradient(145deg,#171d26,#090b10)!important;color:#e5e8ed}
</style></head><body><div id="wn" hidden role="alert" style="background:var(--bad);color:var(--bg);padding:8px 12px;font-weight:600">Not saved: this browser is blocking storage. Your tracker, NPCs, encounters and notes will be lost when you close the app.</div><div class="seg" id="seg"></div><main id="m"></main><script src="enemies.js"></script><script src="loot.js"></script><script src="loot-modern.js"></script><script src="extra2.js"></script><script src="gm2.js"></script><script src="gm.js"></script></body></html>
