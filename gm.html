<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GM tools</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#1d2230;--mute:#5c6475;--line:#d5d9e2;--acc:#2f5d8a;--bad:#a8322d;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--panel:#1a1f2a;--ink:#e4e7ee;--mute:#9aa3b5;--line:#2c3342;--acc:#8fb8e6;--bad:#f08a84;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:44px;cursor:pointer}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;min-height:44px}
.seg{display:flex;overflow-x:auto;position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line)}.seg button{flex:0 0 auto;padding:8px 14px;white-space:nowrap;border:0;border-radius:0;background:none}.seg .on{color:var(--acc);font-weight:700;box-shadow:inset 0 -3px 0 var(--acc)}
main{max-width:40rem;margin:0 auto;padding:12px 14px 60px}h2{font:700 1.05rem Georgia,serif;color:var(--acc);margin:14px 0 6px}
.g3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.meta{color:var(--mute);font-size:14px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;margin:8px 0}
.pk{display:block;width:100%;text-align:left}.pk small{display:block;color:var(--mute)}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.sg div{text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px}.sg b{display:block;font:700 1.2rem Georgia,serif;color:var(--acc)}.sg span{font-size:12px;color:var(--mute)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.row button{flex:1;min-width:4.5rem}.pri{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:700}
.turn{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}.dead strong{text-decoration:line-through;color:var(--mute)}.res{padding:10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-weight:600;margin:8px 0}
.chip{min-height:36px;padding:2px 10px;font-size:14px;flex:0 0 auto!important;min-width:0!important}.f span{display:block;font-size:13px;color:var(--mute)}.f{display:block}.del{color:var(--bad)}








/* After World V9.1 visuals live in aw-visuals.css */
#sess{display:none;padding:6px 10px;font-size:13px;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid rgba(180,154,98,.4)}
#sess.on{display:flex}
#sess b{color:#B49A62}
#sess .sgo{margin-left:auto}

</style>
<link rel="stylesheet" href="aw-visuals.css?v=91"></head><body>
<div id="wn" hidden role="alert" style="background:var(--bad);color:var(--bg);padding:8px 12px;font-weight:600">Not saved: this browser is blocking storage. Your tracker, NPCs, encounters and notes will be lost when you close the app.</div><div class="seg" id="seg"></div><main id="m"></main><script src="enemies.js"></script><script src="loot.js"></script><script src="loot-modern.js"></script><script src="extra2.js"></script><script src="gm2.js"></script><script src="gm.js"></script><script>
(function(){try{var t=localStorage.getItem('aw-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;else document.documentElement.dataset.theme='dark';
window.addEventListener('storage',function(e){if(e.key==='aw-theme'&&(e.newValue==='light'||e.newValue==='dark'))document.documentElement.dataset.theme=e.newValue});
}catch(x){}})();
</script></body></html>
