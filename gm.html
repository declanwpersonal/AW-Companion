<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GM tools</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#1d2230;--mute:#5c6475;--line:#d5d9e2;--acc:#2f5d8a;--bad:#a8322d;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--panel:#1a1f2a;--ink:#e4e7ee;--mute:#9aa3b5;--line:#2c3342;--acc:#8fb8e6;--bad:#f08a84;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:44px;cursor:pointer}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;min-height:44px}
.seg{display:flex;overflow-x:auto;position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line)}.seg button{flex:0 0 auto;padding:8px 14px;white-space:nowrap;border:0;border-radius:0;background:none}.seg .on{color:var(--acc);font-weight:700;box-shadow:inset 0 -3px 0 var(--acc)}
main{max-width:40rem;margin:0 auto;padding:12px 14px 60px}h2{font:700 1.05rem Georgia,serif;color:var(--acc);margin:14px 0 6px}
.g3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.meta{color:var(--mute);font-size:14px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;margin:8px 0}
.pk{display:block;width:100%;text-align:left}.pk small{display:block;color:var(--mute)}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.sg div{text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px}.sg b{display:block;font:700 1.2rem Georgia,serif;color:var(--acc)}.sg span{font-size:12px;color:var(--mute)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.row button{flex:1;min-width:4.5rem}.pri{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:700}
.turn{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}.dead strong{text-decoration:line-through;color:var(--mute)}.res{padding:10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-weight:600;margin:8px 0}
.chip{min-height:36px;padding:2px 10px;font-size:14px;flex:0 0 auto!important;min-width:0!important}.f span{display:block;font-size:13px;color:var(--mute)}.f{display:block}.del{color:var(--bad)}



/* AFTER WORLD — Dark Leather · Dark Aero · Art Deco (default / dark) */
:root:not([data-theme="light"]){
  --bg:#0B0C0F;--panel:#15171C;--panel2:#22252B;--ink:#E2E0D9;--mute:#92969D;
  --line:#3a3f48;--acc:#142C49;--acc2:#20466C;--gold:#B49A62;--silver:#AEB5BE;
  --hit:#B49A62;--bad:#d47c78;color-scheme:dark
}
:root:not([data-theme="light"]),
:root:not([data-theme="light"]) body{
  background-color:#0B0C0F!important;
  background-image:
    linear-gradient(rgba(11,12,15,.72),rgba(11,12,15,.78)),
    url("leather-tile.jpg")!important;
  background-size:auto,480px!important;
  background-repeat:no-repeat,repeat!important;
  background-attachment:fixed!important;
  color:var(--ink)!important;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif!important
}
:root:not([data-theme="light"]) header,
:root:not([data-theme="light"]) .seg,
:root:not([data-theme="light"]) #nav,
:root:not([data-theme="light"]) #res,
:root:not([data-theme="light"]) #ban{
  background:
    linear-gradient(180deg,rgba(21,23,28,.96),rgba(11,12,15,.98)),
    url("obsidian-tile.jpg")!important;
  background-size:auto,320px!important;
  border-color:#3a3f48!important;
  box-shadow:0 2px 14px rgba(0,0,0,.4),inset 0 1px rgba(174,181,190,.08)!important
}
:root:not([data-theme="light"]) header h1,
:root:not([data-theme="light"]) h1,
:root:not([data-theme="light"]) h2,
:root:not([data-theme="light"]) h3,
:root:not([data-theme="light"]) h4{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif!important;
  letter-spacing:.03em;
  color:#c5d4e8!important
}
:root:not([data-theme="light"]) header h1{font-weight:700;color:#E2E0D9!important}
:root:not([data-theme="light"]) main{background:transparent}
:root:not([data-theme="light"]) section,
:root:not([data-theme="light"]) .card,
:root:not([data-theme="light"]) .big div,
:root:not([data-theme="light"]) .sg div,
:root:not([data-theme="light"]) .res,
:root:not([data-theme="light"]) details,
:root:not([data-theme="light"]) .ov{
  background:
    linear-gradient(145deg,rgba(34,37,43,.94),rgba(21,23,28,.97)),
    url("charcoal-tile.jpg")!important;
  background-size:auto,280px!important;
  border:1px solid #3a3f48!important;
  box-shadow:inset 0 1px rgba(174,181,190,.06),0 3px 12px rgba(0,0,0,.25)!important
}
:root:not([data-theme="light"]) button,
:root:not([data-theme="light"]) .btn{
  background:linear-gradient(180deg,#2a2e36,#1a1d23)!important;
  color:#E2E0D9!important;
  border:1px solid #4a505a!important;
  border-radius:5px!important;
  box-shadow:inset 0 1px rgba(174,181,190,.1),0 1px 2px rgba(0,0,0,.3)!important
}
:root:not([data-theme="light"]) button.pri,
:root:not([data-theme="light"]) .pri{
  background:linear-gradient(180deg,#20466C,#142C49)!important;
  border-color:#3d6a9a!important;
  color:#fff!important
}
:root:not([data-theme="light"]) button.on,
:root:not([data-theme="light"]) .seg .on,
:root:not([data-theme="light"]) #nav button.on{
  color:#B49A62!important;
  border-color:#8f7848!important;
  box-shadow:inset 0 -2px #B49A62!important
}
:root:not([data-theme="light"]) input,
:root:not([data-theme="light"]) textarea,
:root:not([data-theme="light"]) select{
  background:#0B0C0F!important;
  color:#E2E0D9!important;
  border:1px solid #3a3f48!important;
  border-radius:5px!important
}
:root:not([data-theme="light"]) a{color:#8fb0d4}
:root:not([data-theme="light"]) th{background:#1a1d24!important;color:#B49A62}
:root:not([data-theme="light"]) td,
:root:not([data-theme="light"]) th{border-color:#3a3f48!important}
:root:not([data-theme="light"]) mark{background:#B49A62!important;color:#0B0C0F!important}
:root:not([data-theme="light"]) #app{background:transparent!important}
:root:not([data-theme="light"]) h2::after{
  content:"";display:block;height:10px;margin:8px 0 4px;
  background:url("deco-divider-sm.jpg") center/contain no-repeat;
  opacity:.7
}
:root:not([data-theme="light"]) .aw-divider{
  display:block;height:12px;margin:16px 0 12px;
  background:url("deco-divider-sm.jpg") center/contain no-repeat;
  opacity:.85;border:0
}


/* App-wide light theme */
:root[data-theme="light"]{
  --bg:#f4f5f7;--panel:#ffffff;--panel2:#eef0f3;--ink:#1d2230;--mute:#5c6475;
  --line:#d5d9e2;--acc:#2f5d8a;--acc2:#3d6fa0;--gold:#8a7340;--silver:#6b7280;
  --hit:#c9a227;--bad:#a8322d;color-scheme:light
}
:root[data-theme="light"],
:root[data-theme="light"] body{
  background-color:#f4f5f7!important;
  background-image:none!important;
  color:#1d2230!important
}
:root[data-theme="light"] header,
:root[data-theme="light"] .seg,
:root[data-theme="light"] #nav,
:root[data-theme="light"] #res,
:root[data-theme="light"] #ban{
  background:#ffffff!important;
  background-image:none!important;
  border-color:#d5d9e2!important;
  box-shadow:0 1px 4px rgba(0,0,0,.06)!important;
  color:#1d2230!important
}
:root[data-theme="light"] h1,
:root[data-theme="light"] h2,
:root[data-theme="light"] h3,
:root[data-theme="light"] h4,
:root[data-theme="light"] header h1{color:#2f5d8a!important}
:root[data-theme="light"] section,
:root[data-theme="light"] .card,
:root[data-theme="light"] .big div,
:root[data-theme="light"] .sg div,
:root[data-theme="light"] .res,
:root[data-theme="light"] details,
:root[data-theme="light"] .ov{
  background:#ffffff!important;
  background-image:none!important;
  border:1px solid #d5d9e2!important;
  box-shadow:0 1px 4px rgba(0,0,0,.05)!important;
  color:#1d2230!important
}
:root[data-theme="light"] button,
:root[data-theme="light"] .btn{
  background:#ffffff!important;
  color:#1d2230!important;
  border:1px solid #d5d9e2!important;
  box-shadow:none!important
}
:root[data-theme="light"] button.pri,
:root[data-theme="light"] .pri{
  background:#2f5d8a!important;
  border-color:#2f5d8a!important;
  color:#fff!important
}
:root[data-theme="light"] button.on,
:root[data-theme="light"] .seg .on,
:root[data-theme="light"] #nav button.on{
  color:#2f5d8a!important;
  border-color:#2f5d8a!important;
  box-shadow:inset 0 -2px #2f5d8a!important
}
:root[data-theme="light"] input,
:root[data-theme="light"] textarea,
:root[data-theme="light"] select{
  background:#f4f5f7!important;
  color:#1d2230!important;
  border:1px solid #d5d9e2!important
}
:root[data-theme="light"] a{color:#2f5d8a}
:root[data-theme="light"] th{background:#eef0f3!important;color:#1d2230!important}
:root[data-theme="light"] td,
:root[data-theme="light"] th{border-color:#d5d9e2!important}
:root[data-theme="light"] mark{background:#ffe08a!important;color:#1d2230!important}
:root[data-theme="light"] #app{background:#f4f5f7!important}
:root[data-theme="light"] h2::after,
:root[data-theme="light"] .aw-divider{opacity:0!important;height:0!important;margin:0!important}

</style></head><body><div id="wn" hidden role="alert" style="background:var(--bad);color:var(--bg);padding:8px 12px;font-weight:600">Not saved: this browser is blocking storage. Your tracker, NPCs, encounters and notes will be lost when you close the app.</div><div class="seg" id="seg"></div><main id="m"></main><script src="enemies.js"></script><script src="loot.js"></script><script src="loot-modern.js"></script><script src="extra2.js"></script><script src="gm2.js"></script><script src="gm.js"></script><script>
(function(){try{var t=localStorage.getItem('aw-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;else document.documentElement.dataset.theme='dark';
window.addEventListener('storage',function(e){if(e.key==='aw-theme'&&(e.newValue==='light'||e.newValue==='dark'))document.documentElement.dataset.theme=e.newValue});
}catch(x){}})();
</script></body></html>
