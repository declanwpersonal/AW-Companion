<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>After World</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#12151c">
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#1d2230;--mute:#5c6475;--line:#d5d9e2;--acc:#2f5d8a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--panel:#1a1f2a;--ink:#e4e7ee;--mute:#9aa3b5;--line:#2c3342;--acc:#8fb8e6;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);background:var(--panel)}
iframe{flex:1;width:100%;border:0;background:var(--bg);min-height:0}
#nav{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 14px;min-height:44px;cursor:pointer}
#sr button{display:block;width:100%;text-align:left;margin:6px 0}#sr small{display:block;color:var(--mute)}#sr h3{margin:14px 0 2px;font-size:.9rem;color:var(--acc)}#nav button{border:0;border-radius:0;background:none}#nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
#ban{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg);border-top:1px solid var(--line);font-size:14px}
#ban span{flex:1}#ban button{min-height:36px;padding:4px 10px;font-size:14px}
.ov{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px;max-width:30rem;margin:0 auto}
.ov[hidden],#ban[hidden],iframe[hidden]{display:none}
.ov h1{margin:0 0 6px;font:700 1.6rem Georgia,serif;color:var(--acc);text-align:center}
.big{padding:22px;font-size:1.2rem;font-weight:700;border-radius:12px}.big small{display:block;font-weight:400;color:var(--mute);font-size:.85rem}
.chk{display:flex;gap:10px;align-items:center;padding:8px 2px}.chk input{width:22px;height:22px}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style></head><body>
<div id="app"><iframe id="f-rule" src="rulebook.html" title="Rulebook"></iframe><iframe id="f-chars" src="sheet.html" title="Characters" hidden></iframe><iframe id="f-gm" src="gm.html" title="GM tools" hidden></iframe>
<div id="ban" hidden><span id="bt"></span><button id="bb"></button><button id="bx">Dismiss</button></div><nav id="nav"></nav></div>
<div class="ov" id="srch" hidden style="justify-content:flex-start;overflow:auto"><input id="sq" type="search" placeholder="Search rules, traits, races, gear" autocomplete="off" style="font:inherit;font-size:16px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)"><div id="sr"></div><button id="sx">Close</button></div>
<div class="ov" id="role" hidden><h1>After World</h1><p style="text-align:center;margin:0;color:var(--mute)">Who are you today?</p><button class="big" data-role="player">Player<small>Rulebook and your characters</small></button><button class="big" data-role="gm">GM<small>Rulebook and your tools</small></button></div>
<div class="ov" id="more" hidden><h1>More</h1><button id="sw">Switch role</button><label class="chk"><input type="checkbox" id="awake"> Keep the screen awake</label><div class="chk">Text size <button id="fm">A−</button><button id="fp">A+</button></div><button id="exp">Back up characters</button><button id="upd">Check for updates</button><button id="mx">Close</button></div>
<script src="data.js"></script>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var TABS={rule:'Rulebook',chars:'Characters',gm:'GM tools',find:'Search'},ROLES={player:['rule','chars','find'],gm:['rule','gm','find']};
var role=ls('aw-role'),tab=ls('aw-tab')||'rule',lock=null,reg=null;
if(!ROLES[role])role=null;
function nav(){$('#nav').innerHTML=ROLES[role].map(function(t){return '<button data-t="'+t+'"'+(t===tab?' class="on"':'')+'>'+TABS[t]+'</button>'}).join('')+'<button data-t="more">More</button>'}
function show(){if(!role)return;if(ROLES[role].indexOf(tab)<0)tab=ROLES[role][0];['rule','chars','gm'].forEach(function(t){$('#f-'+t).hidden=t!==tab});nav()}
function say(msg,label,fn){$('#bt').textContent=msg;$('#bb').textContent=label;$('#bb').onclick=function(){$('#ban').hidden=true;fn()};$('#ban').hidden=false}
function exp(){var d=ls('aw-chars-v1')||'{}',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:'application/json'}));a.download='after-world-characters.json';document.body.appendChild(a);a.click();a.remove()}
function reminder(){var n=0;try{n=Object.keys(JSON.parse(ls('aw-chars-v1')||'{}')).length}catch(e){}
  if(n&&Date.now()-(+ls('aw-bk')||0)>54e6){ls('aw-bk',String(Date.now()));say('Back up your characters in case you change phones.','Export now',exp)}}
var TN={fan:'Fantasy',mod:'Modern',sw:'Star Wars'};
function go(h){$('#srch').hidden=true;tab='rule';show();var w=$('#f-rule').contentWindow;w.location.hash='';w.location.hash='#'+h}
function find(q){q=q.toLowerCase().trim();var G={},D=window.AWDATA||{},add=function(g,t,s,h){(G[g]=G[g]||[]);if(G[g].length<12)G[g].push([t,s,h])},m=function(s){return s.toLowerCase().indexOf(q)>-1};
  if(q.length<2)return'<p style="color:var(--mute)">Type at least two letters.</p>';
  try{$('#f-rule').contentDocument.querySelectorAll('h1[id],h2[id],h3[id],h4[id]').forEach(function(e){if(m(e.textContent))add('Rulebook',e.textContent,'',e.id)})}catch(e){}
  D.abil.forEach(function(a){if(m(a.n+' '+a.id+' '+a.cat))add('Traits and powers',a.n,a.id+' · '+a.cat,a.a)});
  D.races.forEach(function(r){if(m(r.n))add('Races',r.n,TN[r.t],'')});D.bgs.forEach(function(r){if(m(r.n))add('Backgrounds',r.n,TN[r.t],'')});
  D.weapons.forEach(function(w){if(m(w.n))add('Weapons',w.n,w.prof+(w.dmg?' · damage '+w.dmg:''),'')});D.armour.forEach(function(w){if(m(w.n))add('Armour and shields',w.n,w.prof,'')});
  var h='';Object.keys(G).forEach(function(g){h+='<h3>'+g+'</h3>'+G[g].map(function(r){return '<button data-h="'+r[2]+'">'+r[0].replace(/[<&]/g,'')+'<small>'+r[1].replace(/[<&]/g,'')+'</small></button>'}).join('')});return h||'<p style="color:var(--mute)">No matches.</p>'}
$('#sq').oninput=function(){$('#sr').innerHTML=find(this.value)};$('#sx').onclick=function(){$('#srch').hidden=true};
$('#sr').onclick=function(e){var b=e.target.closest('[data-h]');if(b&&b.dataset.h)go(b.dataset.h)};
function zoom(){var z=(+ls('aw-fs')||100)/100;['f-rule','f-chars','f-gm'].forEach(function(i){try{$('#'+i).contentDocument.documentElement.style.zoom=z}catch(e){}})}
['f-rule','f-chars','f-gm'].forEach(function(i){$('#'+i).addEventListener('load',zoom)});
$('#fm').onclick=function(){ls('aw-fs',String(Math.max(80,(+ls('aw-fs')||100)-10)));zoom()};$('#fp').onclick=function(){ls('aw-fs',String(Math.min(150,(+ls('aw-fs')||100)+10)));zoom()};
function wake(){if(ls('aw-awake')==='1'&&'wakeLock' in navigator&&document.visibilityState==='visible'){navigator.wakeLock.request('screen').then(function(l){lock=l}).catch(function(){})}else if(lock){lock.release();lock=null}}
document.addEventListener('visibilitychange',wake);
$('#nav').onclick=function(e){var t=e.target.closest('button');if(!t)return;if(t.dataset.t==='more'){$('#awake').checked=ls('aw-awake')==='1';$('#awake').parentNode.hidden=!('wakeLock' in navigator);$('#more').hidden=false;return}if(t.dataset.t==='find'){$('#srch').hidden=false;$('#sq').focus();return}tab=t.dataset.t;ls('aw-tab',tab);show()};
$('#role').onclick=function(e){var t=e.target.closest('[data-role]');if(!t)return;role=t.dataset.role;ls('aw-role',role);$('#role').hidden=true;show();reminder();try{$('#f-rule').contentWindow.location.reload()}catch(e){}};
$('#sw').onclick=function(){$('#more').hidden=true;$('#role').hidden=false};
$('#mx').onclick=function(){$('#more').hidden=true};
$('#exp').onclick=exp;
$('#awake').onchange=function(){ls('aw-awake',this.checked?'1':'0');wake()};
$('#upd').onclick=function(){$('#more').hidden=true;if(reg)reg.update().then(function(){say('Checked. You have the latest version unless a reload banner appears.','OK',function(){})});else say('Updates are checked when you are online and the app is installed.','OK',function(){})};
$('#bx').onclick=function(){$('#ban').hidden=true};
addEventListener('message',function(e){var d=e.data;if(e.origin!==location.origin||!d||d.aw!=='rule')return;tab='rule';show();var w=$('#f-rule').contentWindow;w.location.hash='';w.location.hash='#'+d.hash});
if(role){show();reminder();wake()}else{$('#role').hidden=false}
if('serviceWorker' in navigator&&location.protocol!=='file:'){var had=!!navigator.serviceWorker.controller;
  addEventListener('load',function(){navigator.serviceWorker.register('sw.js').then(function(r){reg=r}).catch(function(){})});
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(had)say('A new version is ready.','Reload',function(){location.reload()});had=true})}
})();
</script></body></html>
